[project]
name = "habbit"
version = "0.1.0"
description = "Daily curated tech content notifier"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "httpx>=0.27.0",
  "openai>=1.40.0",
  "python-dotenv>=1.0.1",
]

[project.scripts]
habbit = "habbit.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
